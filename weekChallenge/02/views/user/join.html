<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · Community Board</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">새 계정을 만들어 커뮤니티에 참여하세요</p>

      <div id="alert" class="alert"></div>

      <div class="form-group">
        <label>닉네임</label>
        <input type="text" id="username" placeholder="사용할 닉네임을 입력하세요" />
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com" />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="pwd" placeholder="비밀번호를 입력하세요" />
      </div>

      <button class="btn btn-primary" id="joinBtn" onclick="join()">가입하기</button>

      <div class="auth-footer">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert alert-${type} show`;
    }

    async function join() {
      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const pwd      = document.getElementById('pwd').value;
      const btn      = document.getElementById('joinBtn');

      if (!username || !email || !pwd) {
        showAlert('모든 항목을 입력해주세요.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>';

      try {
        const data = await api('POST', '/user', {
          username,
          useremail: email,
          pwd,
          lastlogindt: nowIso(),
        });

        if (data.error_code !== 0) {
          showAlert(data.msg);
        } else {
          showAlert('가입이 완료됐습니다! 로그인 페이지로 이동합니다.', 'success');
          setTimeout(() => location.href = '/login', 1500);
        }
      } catch {
        showAlert('서버에 연결할 수 없습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '가입하기';
      }
    }
  </script>
</body>
</html>
